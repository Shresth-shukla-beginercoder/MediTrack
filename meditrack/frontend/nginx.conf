# MediTrack Frontend — nginx server block
# Listens on 5173 inside the container (compose maps 5173:5173).
server {
    listen       5173;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SPA fallback — unknown paths serve index.html so client-side
    # react-router routes (e.g. /login, /doctor/dashboard) keep working
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
